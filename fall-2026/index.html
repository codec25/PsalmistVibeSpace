<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100b17">
  <meta name="description" content="Open the Psalmist Vibes Studio Fall 2026 interactive music book.">
  <title>Psalmist Vibes — Find Your Sound</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="book-shell" aria-label="Psalmist Vibes interactive magic book">
    <div class="ambient" aria-hidden="true"></div>
    <header class="book-head">
      <p>Psalmist Vibes Studio</p>
      <button id="soundToggle" class="sound" type="button" aria-pressed="true" aria-label="Turn sound off">♪</button>
    </header>

    <section class="book" id="book" aria-live="polite">
      <div class="page-frame" id="pageFrame">
        <div class="page" id="page"></div>
        <div class="edge edge-left" aria-hidden="true"></div>
        <div class="edge edge-right" aria-hidden="true"></div>
      </div>
      <button class="turn previous" id="previous" type="button" aria-label="Previous page">‹</button>
      <button class="turn next" id="next" type="button" aria-label="Next page">›</button>
    </section>

    <nav class="page-nav" aria-label="Book pages">
      <div id="pageDots" class="dots"></div>
      <p id="pageLabel">Invitation · 1 of 3</p>
    </nav>
    <p class="discovery" id="discovery">Tap glowing words and symbols · Swipe to turn</p>
  </main>

  <div class="veil" id="veil" hidden>
    <section class="paper-panel" id="paperPanel" role="dialog" aria-modal="true" aria-labelledby="panelTitle"></section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
